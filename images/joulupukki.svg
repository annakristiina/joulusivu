  <title id="title">Joulupukki</title>
  <desc id="description">Piirretty muotokuva Joulupukista, jolla on lämmin hymy, valkoinen kihara parta, pienet suorakulmaiset silmälasit sekä pehmeä punainen turkisreunainen lakki ja takki.</desc>
